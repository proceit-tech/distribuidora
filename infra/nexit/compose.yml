name: nexit
services:
  db:
    image: postgres:16-bookworm
    container_name: nexit-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Definir banco}
      POSTGRES_USER: ${POSTGRES_USER:?Definir usuario}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir senha}
    volumes:
      - nexit_pgdata:/var/lib/postgresql/data
    networks:
      - nexit_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
networks:
  nexit_internal:
    name: nexit_internal
    internal: true
volumes:
  nexit_pgdata:
    name: nexit_pgdata
